<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kapı etiketleri · Ahır Defteri</title>
<script src="vendor/qrcode.js"></script>
<style>*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#eee;color:#1f2a24}
.bar{position:sticky;top:0;background:#1f4d3a;color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar button{background:#fff;color:#1f4d3a;border:0;padding:9px 14px;border-radius:10px;font-weight:700;font-size:15px}
.page{max-width:820px;margin:16px auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 10px}
.lab{background:#fff;border:2px dashed #bbb;border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;break-inside:avoid;page-break-inside:avoid}
.lab svg{width:120px;height:120px;flex:none}.n{font-size:22px;font-weight:800;line-height:1.15}.o{font-size:12px;color:#555;margin-top:6px}.h{font-size:11px;color:#777;margin-top:4px}
@media print{body{background:#fff}.bar{display:none}.page{margin:0;max-width:none;gap:6mm}.lab{border:1px solid #999}}
@media (max-width:560px){.page{grid-template-columns:1fr}}</style></head>
<body><div class="bar"><b style="flex:1">🏷️ Kapı etiketleri</b><button onclick="print()">Yazdır / PDF</button></div><div class="page" id="p"></div>
<script>
function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))}
var esc=function(t){return String(t||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
try{var d=dec(location.hash.slice(1)),base=location.href.replace(/etiket\.html.*$/,'at.html#'),h='';
d.h.forEach(function(x){var q=qrcode(0,'M');q.addData(base+x.i);q.make();h+='<div class="lab">'+q.createSvgTag({cellSize:4,margin:1,scalable:true})+'<div><div class="n">'+esc(x.n)+'</div><div class="o">'+esc(d.o)+'</div><div class="h">Ahır Defteri ile okut</div></div></div>'});
document.getElementById('p').innerHTML=h}catch(e){document.getElementById('p').innerHTML='<p style="padding:20px">Etiket bilgisi okunamadı. Uygulamadan tekrar aç.</p>'}
</script></body></html>
