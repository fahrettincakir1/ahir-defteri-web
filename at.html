<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ahır Defteri</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f1ea;color:#1f2a24;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:20px}.b{display:inline-block;background:#1f4d3a;color:#fff;padding:12px 20px;border-radius:12px;text-decoration:none;font-weight:600;margin-top:14px}</style></head>
<body><div><div style="font-size:48px">🐎</div><h2>Ahır Defteri açılıyor…</h2><p id="m">Bu etiket bir ata ait. Uygulama yüklüyse otomatik açılır.</p><a class="b" id="l" href="#">Uygulamada aç</a><p style="font-size:13px;color:#666;margin-top:18px">Uygulama yüklü değilse: <a href="index.html">Ahır Defteri hakkında</a></p></div>
<script>var id=(location.hash||'').slice(1).replace(/[^0-9a-f-]/gi,'');var u='ahirdefteri://at/'+id;document.getElementById('l').href=u;if(id.length===36){setTimeout(function(){location.href=u},150)}else{document.getElementById('m').textContent='Etiket bağlantısı hatalı.'}</script></body></html>
